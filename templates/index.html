<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Метрики отдела СА</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #8e2de2, #e3002f);
            margin: 0;
            padding: 0;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .content {
            width: 100%;
            max-width: 1400px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header img {
            width: 130px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 30px;
            color: #222;
        }

        .table-wrapper {
            overflow-x: auto;
            max-width: 100%;
        }

        table {
            border-collapse: collapse;
            min-width: 1200px;
            width: max-content;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border: 1px solid #ddd;
            vertical-align: top;

            /* 💣 Сюда вся магия */
            max-width: 250px;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: normal;
        }

        th {
            background-color: #f2f2f2;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            background-color: #fff;
            z-index: 3;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        @media (max-width: 768px) {
            h1 { font-size: 22px; }
            th, td { padding: 8px; font-size: 14px; }
            .content { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="content">
        <header>
            <img src="/static/logo.png" alt="Страна Девелопмент">
            <h1>Метрики отдела СА</h1>
        </header>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        {% for col in columns %}
                            <th>{{ col }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for row in rows %}
                        <tr>
                            {% for cell in row %}
                                <td>{{ cell }}</td>
                            {% endfor %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
